<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cam-flow</title>
    <meta name="theme-color" content="#08141a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/cam-flow/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <video id="camera" autoplay playsinline muted></video>
    <div id="fps-meter">
      <div class="fps-rate">-- fps</div>
      <div class="fps-detail">measuring...</div>
      <div class="fps-stages"></div>
    </div>
    <div id="mode-panel">
      <button id="panel-toggle" type="button" aria-label="Hide controls">&times;</button>

      <div class="panel-section">
        <span class="section-label">Mode</span>
        <div class="button-row">
          <button id="mode-fluid" type="button">Fluid</button>
          <button id="mode-ripple" type="button">Ripple</button>
          <button id="mode-combined" type="button">Combined</button>
          <button id="double-tap-toggle" type="button">Double Tap FX</button>
        </div>
      </div>

      <div class="panel-section">
        <span class="section-label">Effects</span>
        <div class="button-row">
          <button id="distance-gate" type="button">Distance Gate</button>
          <button id="segmentation-toggle" type="button">Segmentation</button>
          <button id="multi-finger-toggle" type="button">Multi Finger</button>
          <button id="particles-toggle" type="button">Particles</button>
        </div>
        <label class="slider-control">
          <span>Single finger radius</span>
          <input id="single-radius-slider" type="range" min="0.25" max="3" step="0.05" value="1" />
        </label>
        <label class="slider-control">
          <span>Multi finger radius</span>
          <input id="multi-radius-slider" type="range" min="0.25" max="3" step="0.05" value="1" />
        </label>
        <label class="slider-control">
          <span>Fluid speed</span>
          <input id="fluid-speed-slider" type="range" min="0.25" max="3" step="0.05" value="1" />
        </label>
        <label class="slider-control">
          <span>Ripple strength</span>
          <input id="ripple-strength-slider" type="range" min="0.25" max="3" step="0.05" value="1" />
        </label>
        <label class="slider-control">
          <span>Fluid threshold</span>
          <input id="fluid-threshold-slider" type="range" min="0.0002" max="0.01" step="0.0002" value="0.0015" />
        </label>
        <label class="slider-control">
          <span>Ripple threshold</span>
          <input id="ripple-threshold-slider" type="range" min="0.0002" max="0.01" step="0.0002" value="0.0015" />
        </label>
      </div>

      <div class="panel-section">
        <span class="section-label">Performance</span>
        <div class="button-row">
          <button id="fps-toggle" type="button">FPS Meter</button>
        </div>
      </div>

      <div class="panel-section">
        <span class="section-label">Camera</span>
        <div class="button-row">
          <button id="camera-toggle" type="button">Switch Camera</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

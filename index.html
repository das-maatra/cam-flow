<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cam-flow</title>
    <meta name="theme-color" content="#08141a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/cam-flow/icons/apple-touch-icon.png" />
    <style>
      :root {
        --accent: #ff4d3d;
        --accent-light: #ff8a6a;
        --panel-bg: rgba(16, 16, 20, 0.28);
        --panel-border: rgba(255, 255, 255, 0.14);
      }
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        touch-action: manipulation;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      /* video { width: 100%; height: 100%; object-fit: cover; } */
      video{ display: none; }

      #mode-panel {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 18px;
        width: calc(100% - 24px);
        max-width: 440px;
        max-height: calc(100vh - 100px);
        overflow-y: auto;
        background: var(--panel-bg);
        backdrop-filter: blur(32px) saturate(180%);
        -webkit-backdrop-filter: blur(32px) saturate(180%);
        border: 1px solid var(--panel-border);
        border-radius: 22px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3), 0 1px 0 rgba(255, 255, 255, 0.06) inset;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.35s ease-in-out;
        z-index: 10;
        color: white;
        font-size: 15px;
      }
      #mode-panel.visible {
        opacity: 1;
        pointer-events: auto;
      }
      #mode-panel .panel-section {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      #mode-panel .section-label {
        font-size: 0.7em;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.55);
      }
      #mode-panel .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      #mode-panel button {
        padding: 9px 18px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        font: inherit;
        font-weight: 500;
        white-space: nowrap;
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.05));
        color: white;
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.08) inset, 0 2px 6px rgba(0, 0, 0, 0.15);
        transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
      }
      #mode-panel button:active {
        transform: scale(0.96);
      }
      #mode-panel button.active {
        border-color: rgba(255, 255, 255, 0.2);
        background: linear-gradient(180deg, var(--accent-light), var(--accent));
        color: white;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.25) inset, 0 4px 16px rgba(255, 77, 61, 0.45);
      }
      #mode-panel .slider-control {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
      }
      #mode-panel .slider-control span {
        white-space: nowrap;
        font-size: 0.8em;
        color: rgba(255, 255, 255, 0.75);
        min-width: 118px;
      }
      #mode-panel .slider-control input[type="range"] {
        flex: 1;
      }

      /* Custom slider look -- native range inputs render wildly differently
         (and blandly) across iOS/Android/desktop, so style track + thumb
         explicitly for a consistent, contemporary appearance. The filled
         portion of the track uses --fill, a percentage kept in sync with the
         current value by bindSlider() in main.js. */
      #mode-panel input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        height: 5px;
        border-radius: 999px;
        background: linear-gradient(to right, var(--accent) var(--fill, 0%), rgba(255, 255, 255, 0.18) var(--fill, 0%));
        outline: none;
      }
      #mode-panel input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: white;
        border: 3px solid var(--accent);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
        cursor: pointer;
      }
      #mode-panel input[type="range"]::-moz-range-thumb {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: white;
        border: 3px solid var(--accent);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
        cursor: pointer;
      }
      #mode-panel input[type="range"]::-moz-range-track {
        height: 5px;
        border-radius: 999px;
        background: transparent;
      }
      #mode-panel input[type="range"]::-moz-range-progress {
        height: 5px;
        border-radius: 999px;
        background: var(--accent);
      }

      /* #mode-panel #panel-toggle (not just #panel-toggle) so this reliably
         beats #mode-panel button's specificity -- an ID+type selector
         otherwise outranks a lone ID and would silently override this
         button's padding/sizing, breaking centering of the x glyph. */
      #mode-panel #panel-toggle {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 30px;
        height: 30px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        border: none;
        font: inherit;
        font-size: 16px;
        line-height: 1;
        background: rgba(255, 255, 255, 0.1);
        color: var(--accent);
      }
    </style>
    <script type="module" crossorigin src="/cam-flow/assets/index-BzNvK-Sf.js"></script>
  <link rel="manifest" href="/cam-flow/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/cam-flow/registerSW.js"></script></head>
  <body>
    <video id="camera" autoplay playsinline muted></video>
    <div id="mode-panel">
      <button id="panel-toggle" type="button" aria-label="Hide controls">&times;</button>

      <div class="panel-section">
        <span class="section-label">Mode</span>
        <div class="button-row">
          <button id="mode-fluid" type="button">Fluid</button>
          <button id="mode-ripple" type="button">Ripple</button>
          <button id="mode-combined" type="button">Combined</button>
        </div>
      </div>

      <div class="panel-section">
        <span class="section-label">Effects</span>
        <div class="button-row">
          <button id="distance-gate" type="button">Distance Gate</button>
          <button id="segmentation-toggle" type="button">Segmentation</button>
          <button id="multi-finger-toggle" type="button">Multi Finger</button>
        </div>
        <label class="slider-control">
          <span>Single finger radius</span>
          <input id="single-radius-slider" type="range" min="0.25" max="3" step="0.05" value="1" />
        </label>
        <label class="slider-control">
          <span>Multi finger radius</span>
          <input id="multi-radius-slider" type="range" min="0.25" max="3" step="0.05" value="1" />
        </label>
        <label class="slider-control">
          <span>Fluid speed</span>
          <input id="fluid-speed-slider" type="range" min="0.25" max="3" step="0.05" value="1" />
        </label>
        <label class="slider-control">
          <span>Ripple strength</span>
          <input id="ripple-strength-slider" type="range" min="0.25" max="3" step="0.05" value="1" />
        </label>
        <label class="slider-control">
          <span>Fluid threshold</span>
          <input id="fluid-threshold-slider" type="range" min="0.0002" max="0.01" step="0.0002" value="0.0015" />
        </label>
        <label class="slider-control">
          <span>Ripple threshold</span>
          <input id="ripple-threshold-slider" type="range" min="0.0002" max="0.01" step="0.0002" value="0.0015" />
        </label>
      </div>

      <div class="panel-section">
        <span class="section-label">Camera</span>
        <div class="button-row">
          <button id="camera-toggle" type="button">Switch Camera</button>
        </div>
      </div>
    </div>
  </body>
</html>

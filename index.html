<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cam-flow</title>
    <meta name="theme-color" content="#08141a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/cam-flow/icons/apple-touch-icon.png" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; touch-action: manipulation; }
      /* video { width: 100%; height: 100%; object-fit: cover; } */
      video{ display: none; }

      #mode-panel {
        position: fixed;
        left: 50%;
        bottom: 40px;
        transform: translateX(-50%);
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        padding: 10px;
        width: calc(100% - 24px);
        max-width: 420px;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 24px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
        z-index: 10;
      }
      #mode-panel.visible {
        opacity: 1;
        pointer-events: auto;
      }
      #mode-panel button {
        padding: 8px 16px;
        border-radius: 999px;
        border: none;
        font: inherit;
        white-space: nowrap;
        background: rgba(255, 255, 255, 0.15);
        color: white;
      }
      #mode-panel button.active {
        background: white;
        color: black;
      }
    </style>
    <script type="module" crossorigin src="/cam-flow/assets/index-DVPRA2E5.js"></script>
  <link rel="manifest" href="/cam-flow/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/cam-flow/registerSW.js"></script></head>
  <body>
    <video id="camera" autoplay playsinline muted></video>
    <div id="mode-panel">
      <button id="mode-fluid" type="button">Fluid</button>
      <button id="mode-ripple" type="button">Ripple</button>
      <button id="distance-gate" type="button">Distance Gate</button>
      <button id="segmentation-toggle" type="button">Segmentation</button>
      <button id="multi-finger-toggle" type="button">Multi Finger</button>
      <button id="camera-toggle" type="button">Switch Camera</button>
    </div>
  </body>
</html>
